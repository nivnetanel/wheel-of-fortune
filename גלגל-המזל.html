<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>גלגל המזל</title>
    <style>
      :root {
        --neon-pink: #ff2079;
        --neon-cyan: #00eaff;
        --neon-yellow: #ffea00;
        --neon-green: #39ff14;
        --neon-purple: #b026ff;
        --neon-orange: #ff6a00;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: radial-gradient(circle at 50% 0%, #1a0b2e 0%, #0a0714 45%, #050208 100%);
        color: #fff;
        font-family: "Segoe UI", Tahoma, Arial, sans-serif;
        overflow-x: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
        padding: 24px 12px 60px;
      }

      header {
        text-align: center;
        margin-bottom: 10px;
      }

      header h1 {
        font-size: clamp(28px, 6vw, 52px);
        margin: 0 0 6px;
        letter-spacing: 2px;
        color: #fff;
        text-shadow:
          0 0 8px var(--neon-cyan),
          0 0 18px var(--neon-cyan),
          0 0 40px var(--neon-pink),
          0 0 70px var(--neon-pink);
        animation: titlePulse 2.6s ease-in-out infinite;
      }

      header p {
        margin: 0;
        color: #ffea00;
        text-shadow: 0 0 10px rgba(255, 234, 0, 0.7);
        font-size: clamp(14px, 2.6vw, 18px);
        letter-spacing: 1px;
      }

      @keyframes titlePulse {
        0%,
        100% {
          filter: brightness(1);
        }
        50% {
          filter: brightness(1.25);
        }
      }

      #loading {
        margin-top: 80px;
        font-size: 20px;
        color: var(--neon-cyan);
        text-shadow: 0 0 12px var(--neon-cyan);
        letter-spacing: 1px;
      }

      .wheel-wrap {
        position: relative;
        width: min(640px, 92vw);
        aspect-ratio: 1/1;
        margin: 26px auto 30px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .wheel-wrap[hidden] {
        display: none;
      }

      .lights {
        position: absolute;
        inset: -14px;
        border-radius: 50%;
        pointer-events: none;
      }
      .lights span {
        position: absolute;
        width: 12px;
        height: 12px;
        margin: -6px;
        border-radius: 50%;
        background: #fff8c9;
        box-shadow:
          0 0 8px 3px #ffe98a,
          0 0 18px 6px rgba(255, 220, 80, 0.6);
        animation: bulbTwinkle 1.4s infinite ease-in-out;
      }
      @keyframes bulbTwinkle {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.35;
          transform: scale(0.75);
        }
      }

      .rim {
        position: absolute;
        inset: 6px;
        border-radius: 50%;
        background: conic-gradient(from 0deg, #3a1c63, #12122b, #3a1c63);
        box-shadow:
          0 0 0 6px #0d0616,
          0 0 30px 6px var(--neon-purple),
          inset 0 0 40px rgba(0, 0, 0, 0.6);
        z-index: 0;
      }

      #wheelCanvas {
        position: relative;
        z-index: 1;
        width: 92%;
        height: 92%;
        border-radius: 50%;
        box-shadow: 0 0 25px rgba(0, 0, 0, 0.6);
        transform: rotate(0deg);
        will-change: transform;
      }

      .pointer {
        position: absolute;
        top: -6px;
        left: 50%;
        transform: translateX(-50%);
        width: 0;
        height: 0;
        border-left: 20px solid transparent;
        border-right: 20px solid transparent;
        border-top: 38px solid var(--neon-yellow);
        filter: drop-shadow(0 0 10px var(--neon-yellow)) drop-shadow(0 0 18px #fff176);
        z-index: 5;
      }

      #spinBtn {
        position: absolute;
        z-index: 4;
        width: 22%;
        height: 22%;
        border-radius: 50%;
        border: 3px solid #fff;
        background: radial-gradient(circle at 35% 30%, #ff4fa3, #b0007a 65%, #6d0050);
        color: #fff;
        font-weight: 800;
        font-size: clamp(12px, 1.9vw, 16px);
        letter-spacing: 0.5px;
        line-height: 1.25;
        cursor: pointer;
        box-shadow:
          0 0 18px var(--neon-pink),
          0 0 40px rgba(255, 32, 121, 0.6),
          inset 0 0 12px rgba(255, 255, 255, 0.35);
        transition:
          transform 0.15s ease,
          box-shadow 0.15s ease,
          filter 0.3s ease;
      }
      #spinBtn:hover:not(:disabled) {
        transform: scale(1.06);
        box-shadow:
          0 0 26px var(--neon-pink),
          0 0 60px rgba(255, 32, 121, 0.8),
          inset 0 0 14px rgba(255, 255, 255, 0.45);
      }
      #spinBtn:active:not(:disabled) {
        transform: scale(0.97);
      }
      #spinBtn:disabled {
        filter: grayscale(0.6) brightness(0.7);
        cursor: not-allowed;
      }

      .result-overlay {
        position: fixed;
        inset: 0;
        background: rgba(3, 2, 10, 0.86);
        backdrop-filter: blur(3px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        animation: fadeIn 0.35s ease;
      }
      .result-overlay.hidden {
        display: none;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      #confettiCanvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 51;
      }

      .result-card {
        position: relative;
        z-index: 52;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        padding: 40px 46px;
        border-radius: 24px;
        background: linear-gradient(160deg, #1b0e33, #0c0818);
        border: 2px solid var(--neon-cyan);
        box-shadow:
          0 0 30px var(--neon-cyan),
          0 0 70px rgba(0, 234, 255, 0.45),
          inset 0 0 30px rgba(0, 234, 255, 0.08);
        animation: popIn 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        max-width: 90vw;
      }

      @keyframes popIn {
        0% {
          transform: scale(0.5);
          opacity: 0;
        }
        100% {
          transform: scale(1);
          opacity: 1;
        }
      }

      #winnerImg {
        width: 170px;
        height: 170px;
        border-radius: 50%;
        object-fit: cover;
        border: 5px solid var(--neon-yellow);
        box-shadow:
          0 0 20px var(--neon-yellow),
          0 0 50px rgba(255, 234, 0, 0.6);
      }

      #winnerName {
        font-size: clamp(28px, 5vw, 44px);
        margin: 0;
        text-align: center;
        color: #fff;
        text-shadow:
          0 0 10px var(--neon-pink),
          0 0 30px var(--neon-pink);
      }

      .congrats {
        margin: 0;
        font-size: 20px;
        color: var(--neon-green);
        text-shadow: 0 0 10px var(--neon-green);
      }

      #spinAgainBtn {
        margin-top: 8px;
        padding: 14px 34px;
        border-radius: 40px;
        border: 2px solid var(--neon-cyan);
        background: transparent;
        color: #fff;
        font-size: 17px;
        font-weight: 700;
        letter-spacing: 0.5px;
        cursor: pointer;
        box-shadow: 0 0 12px var(--neon-cyan);
        transition: all 0.2s ease;
      }
      #spinAgainBtn:hover {
        background: var(--neon-cyan);
        color: #04222a;
        box-shadow:
          0 0 26px var(--neon-cyan),
          0 0 50px rgba(0, 234, 255, 0.6);
      }

      footer {
        margin-top: auto;
        padding-top: 20px;
        color: #5a5670;
        font-size: 12px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>🎡 גלגל המזל</h1>
      <p>מי יהיה הזוכה הבא?</p>
    </header>

    <div id="loading">טוען עובדים... ⏳</div>

    <div class="wheel-wrap" id="wheelWrap" hidden>
      <div class="lights" id="lights"></div>
      <div class="rim"></div>
      <canvas id="wheelCanvas" width="900" height="900"></canvas>
      <div class="pointer"></div>
      <button id="spinBtn">סובב את<br />הגלגל</button>
    </div>

    <footer>גלגל המזל &mdash; משחק לעובדים</footer>

    <div class="result-overlay hidden" id="resultOverlay">
      <canvas id="confettiCanvas"></canvas>
      <div class="result-card">
        <img id="winnerImg" src="" alt="תמונת הזוכה" />
        <h2 id="winnerName"></h2>
        <p class="congrats">🎉 מזל טוב! 🎉</p>
        <button id="spinAgainBtn">סיבוב נוסף</button>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        // ---------------------------------------------------------------
        // רשימת קבצי התמונות. שם העובד נגזר אוטומטית משם הקובץ (ללא סיומת).
        // כדי להוסיף/להסיר עובד - פשוט הוסף/הסר שורה כאן (הקובץ חייב להיות
        // באותה תיקייה כמו קובץ ה-HTML הזה).
        // ---------------------------------------------------------------
        const files = ["דני.JPG", "אברהם.JPG", "משה.JPG", "יעקב.JPG", "דוד.JPG", "יוסי.JPG", "רון.JPG", "אורי.JPG", "גיל.JPG", "עידו.JPG", "נועה.JPG", "מיכל.JPG", "שירה.JPG", "טל.JPG", "יעל.JPG", "רותם.JPG", "ליאור.JPG", "אביגיל.JPG", "שרה.JPG", "רחל.JPG", "איתי.JPG", "עומר.JPG", "נדב.JPG", "אלון.JPG", "בועז.JPG", "חנה.JPG", "מירי.JPG", "דנה.JPG", "אסתי.JPG", "רבקה.JPG"];

        const employees = files.map(function (file) {
          return { file: file, name: file.replace(/\.[^/.]+$/, "") };
        });

        // ערבוב סדר הצגה על הגלגל (לא משפיע על ההגרלה עצמה - רק על סדר הוויזואל)
        for (let i = employees.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          const tmp = employees[i];
          employees[i] = employees[j];
          employees[j] = tmp;
        }

        const COLORS = ["#ff2079", "#00eaff", "#ffea00", "#39ff14", "#b026ff", "#ff6a00", "#ff4d6d", "#12d6df"];

        const canvas = document.getElementById("wheelCanvas");
        const ctx = canvas.getContext("2d");
        const spinBtn = document.getElementById("spinBtn");
        const wheelWrap = document.getElementById("wheelWrap");
        const loadingEl = document.getElementById("loading");
        const resultOverlay = document.getElementById("resultOverlay");
        const winnerImg = document.getElementById("winnerImg");
        const winnerName = document.getElementById("winnerName");
        const spinAgainBtn = document.getElementById("spinAgainBtn");
        const lightsWrap = document.getElementById("lights");

        const SIZE = 900; // logical drawing size
        let currentRotation = 0;
        let spinning = false;
        let tickTimer = null;
        let spinEndTimer = null;
        let confettiAnim = null;

        function loadImage(src) {
          return new Promise(function (resolve) {
            const img = new Image();
            img.onload = function () {
              resolve(img);
            };
            img.onerror = function () {
              resolve(null);
            };
            img.src = src;
          });
        }

        function buildLights() {
          const n = 24;
          const html = [];
          for (let i = 0; i < n; i++) {
            const angle = (i / n) * 360;
            html.push('<span style="top:' + (50 + 48 * Math.sin((angle * Math.PI) / 180)) + "%; left:" + (50 + 48 * Math.cos((angle * Math.PI) / 180)) + "%; animation-delay:" + i * 0.06 + 's;"></span>');
          }
          lightsWrap.innerHTML = html.join("");
        }

        function drawWheel() {
          const dpr = window.devicePixelRatio || 1;
          canvas.width = SIZE * dpr;
          canvas.height = SIZE * dpr;
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          const center = SIZE / 2;
          const radius = center - 8;
          const n = employees.length;
          const segAngle = (Math.PI * 2) / n;

          ctx.clearRect(0, 0, SIZE, SIZE);

          for (let i = 0; i < n; i++) {
            const emp = employees[i];
            const start = i * segAngle;
            const end = start + segAngle;
            const mid = start + segAngle / 2;

            // segment
            ctx.beginPath();
            ctx.moveTo(center, center);
            ctx.arc(center, center, radius, start, end);
            ctx.closePath();
            ctx.fillStyle = COLORS[i % COLORS.length];
            ctx.fill();
            ctx.lineWidth = 2;
            ctx.strokeStyle = "rgba(255,255,255,.4)";
            ctx.stroke();

            // content (name + thumbnail), flipped for readability on the left half
            const flip = Math.cos(mid) < 0;
            const dir = flip ? -1 : 1;

            ctx.save();
            ctx.translate(center, center);
            ctx.rotate(mid + (flip ? Math.PI : 0));

            ctx.direction = "rtl";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillStyle = "#fff";
            ctx.font = "bold 20px Segoe UI, Arial, sans-serif";
            ctx.shadowColor = "rgba(0,0,0,.65)";
            ctx.shadowBlur = 4;
            ctx.fillText(emp.name, dir * radius * 0.53, 6);
            ctx.shadowBlur = 0;

            const imgR = radius * 0.085;
            const imgX = dir * radius * 0.82;
            const imgY = 0;

            if (emp.img) {
              ctx.save();
              ctx.beginPath();
              ctx.arc(imgX, imgY, imgR, 0, Math.PI * 2);
              ctx.closePath();
              ctx.clip();
              try {
                ctx.drawImage(emp.img, imgX - imgR, imgY - imgR, imgR * 2, imgR * 2);
              } catch (e) {
                /* ignore broken image */
              }
              ctx.restore();
            }
            ctx.beginPath();
            ctx.arc(imgX, imgY, imgR, 0, Math.PI * 2);
            ctx.lineWidth = 3;
            ctx.strokeStyle = "#fff";
            ctx.stroke();

            ctx.restore();
          }

          // hub ring
          ctx.beginPath();
          ctx.arc(center, center, radius * 0.06, 0, Math.PI * 2);
          ctx.fillStyle = "#0d0616";
          ctx.fill();
          ctx.lineWidth = 4;
          ctx.strokeStyle = "#fff";
          ctx.stroke();
        }

        // ---------------- audio (Web Audio API, no external files) ----------------
        let audioCtx = null;
        function ensureAudio() {
          if (!audioCtx) {
            const AC = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AC();
          }
          if (audioCtx.state === "suspended") audioCtx.resume();
        }

        function playTick() {
          if (!audioCtx) return;
          const t = audioCtx.currentTime;
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = "square";
          osc.frequency.setValueAtTime(1250, t);
          gain.gain.setValueAtTime(0.16, t);
          gain.gain.exponentialRampToValueAtTime(0.001, t + 0.055);
          osc.connect(gain).connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.06);
        }

        function scheduleTicks(duration) {
          clearTimeout(tickTimer);
          let elapsed = 0;
          let interval = 65;
          (function step() {
            if (elapsed >= duration - 350) return;
            playTick();
            interval = Math.min(480, interval * 1.065);
            elapsed += interval;
            tickTimer = setTimeout(step, interval);
          })();
        }

        function playWinSound() {
          ensureAudio();
          const notes = [523.25, 659.25, 783.99, 1046.5, 1318.5];
          notes.forEach(function (freq, idx) {
            const t = audioCtx.currentTime + idx * 0.15;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = "triangle";
            osc.frequency.setValueAtTime(freq, t);
            gain.gain.setValueAtTime(0.0001, t);
            gain.gain.exponentialRampToValueAtTime(0.28, t + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
            osc.connect(gain).connect(audioCtx.destination);
            osc.start(t);
            osc.stop(t + 0.45);
          });
        }

        // ---------------------------- confetti -------------------------------
        function launchConfetti() {
          const cc = document.getElementById("confettiCanvas");
          cc.width = window.innerWidth;
          cc.height = window.innerHeight;
          const cctx = cc.getContext("2d");
          const colors = ["#ff2079", "#00eaff", "#ffea00", "#39ff14", "#b026ff", "#ff6a00", "#ffffff"];
          const particles = [];
          const count = 170;
          for (let i = 0; i < count; i++) {
            particles.push({
              x: Math.random() * cc.width,
              y: -20 - Math.random() * cc.height * 0.5,
              w: 6 + Math.random() * 6,
              h: 8 + Math.random() * 10,
              color: colors[Math.floor(Math.random() * colors.length)],
              rot: Math.random() * 360,
              vRot: -8 + Math.random() * 16,
              vy: 2 + Math.random() * 3,
              vx: -2 + Math.random() * 4,
              opacity: 1,
            });
          }
          let frame = 0;
          const maxFrames = 420;

          if (confettiAnim) cancelAnimationFrame(confettiAnim);

          (function animate() {
            frame++;
            cctx.clearRect(0, 0, cc.width, cc.height);
            particles.forEach(function (p) {
              p.x += p.vx;
              p.y += p.vy;
              p.vy += 0.03;
              p.rot += p.vRot;
              if (frame > maxFrames - 90) p.opacity -= 0.012;
              cctx.save();
              cctx.globalAlpha = Math.max(p.opacity, 0);
              cctx.translate(p.x, p.y);
              cctx.rotate((p.rot * Math.PI) / 180);
              cctx.fillStyle = p.color;
              cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
              cctx.restore();
            });
            if (frame < maxFrames) {
              confettiAnim = requestAnimationFrame(animate);
            } else {
              cctx.clearRect(0, 0, cc.width, cc.height);
            }
          })();
        }

        // ------------------------------ spin logic ----------------------------
        function spin() {
          if (spinning) return;
          spinning = true;
          spinBtn.disabled = true;
          ensureAudio();

          const n = employees.length;
          const winnerIndex = Math.floor(Math.random() * n);
          const segAngleDeg = 360 / n;
          const desiredStopAngle = winnerIndex * segAngleDeg + segAngleDeg / 2;
          const pointerAngleDeg = 270; // top of the wheel, 0 = east, clockwise

          let targetMod = (((pointerAngleDeg - desiredStopAngle) % 360) + 360) % 360;
          let deltaFromCurrent = targetMod - (currentRotation % 360);
          if (deltaFromCurrent <= 0) deltaFromCurrent += 360;

          const extraSpins = 8 + Math.floor(Math.random() * 5); // 8-12 full turns
          const newRotation = currentRotation + deltaFromCurrent + 360 * extraSpins;
          const duration = 8000 + Math.random() * 3000; // 8-11 seconds

          canvas.style.transition = "transform " + duration / 1000 + "s cubic-bezier(0.12,0.66,0.14,1)";
          requestAnimationFrame(function () {
            canvas.style.transform = "rotate(" + newRotation + "deg)";
          });

          scheduleTicks(duration);
          currentRotation = newRotation;

          clearTimeout(spinEndTimer);
          spinEndTimer = setTimeout(function () {
            spinning = false;
            showResult(employees[winnerIndex]);
          }, duration + 150);
        }

        function showResult(emp) {
          winnerImg.src = emp.file;
          winnerImg.alt = emp.name;
          winnerName.textContent = emp.name;
          resultOverlay.classList.remove("hidden");
          launchConfetti();
          playWinSound();
          spinBtn.disabled = false;
        }

        spinBtn.addEventListener("click", spin);
        spinAgainBtn.addEventListener("click", function () {
          resultOverlay.classList.add("hidden");
          if (confettiAnim) cancelAnimationFrame(confettiAnim);
        });

        window.addEventListener("resize", function () {
          if (!resultOverlay.classList.contains("hidden")) {
            const cc = document.getElementById("confettiCanvas");
            cc.width = window.innerWidth;
            cc.height = window.innerHeight;
          }
        });

        // ------------------------------- init ----------------------------------
        buildLights();

        Promise.all(
          employees.map(function (emp) {
            return loadImage(emp.file);
          }),
        ).then(function (imgs) {
          employees.forEach(function (emp, i) {
            emp.img = imgs[i];
          });
          drawWheel();
          loadingEl.style.display = "none";
          wheelWrap.hidden = false;
        });
      })();
    </script>
  </body>
</html>
